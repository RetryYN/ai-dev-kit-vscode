glossary:
  - term: "PLAN"
    definition: "implementation tree (L1〜L4 内包) を内蔵する起票単位"
    cli: "helix plan <list|show|status|draft|review|finalize|reset|mini|deps|generates|import> (cli/helix-plan-cmds/ 11 subcommand) + lint (logic は cli/lib/plan_lint.py 経由、subcommand 形態は helix plan finalize --no-lint flag で参照)"
    file_path: "docs/plans/L<NN>/L<NN>-○○○plan.md / cli/templates/plan/v2/L<NN>-*.md"
    schema_field: "plan_registry table + 関連 (plan_dependencies / plan_generates / plan_references / plan_reviews / plan_agent_slots table)"
    grep_pattern: "^L[0-9]+-.*plan\\.md$"
    implementation_status: "installed"
  - term: "gate"
    definition: "工程突合チェックポイント (G0.5 / G1 / G1.5 / G1R / G2-G14)"
    cli: "helix gate <NN> (cli/helix-gate 実在、--static-only / --readiness-mode 実装済)"
    file_path: ".helix/gate-checks.yaml / cli/config/gate-policy.yaml"
    schema_field: "gate_runs table + phase_gate_runs table + gate_audit_metrics table"
    grep_pattern: "^G[0-9]+"
    implementation_status: "partial"
  - term: "workflow"
    definition: "HELIX 入口判定 (Forward + workflow 群)"
    cli: "helix route (cli/helix-route 実在)"
    file_path: "cli/lib/route_engine.py"
    schema_field: "frontmatter.process_layer"
    grep_pattern: "workflow:\\s*(Forward|Scrum|Discovery|Reverse|Incident|Add-feature|Refactor|Retrofit|Research|Recovery)"
    implementation_status: "installed"
  - term: "legacy drive field"
    definition: "既存 CLI / validator に残る対象領域分類。HELIX コア概念ではなく、Forward 工程内の対象領域・実装観点として扱う"
    cli: "helix size --drive <type>"
    file_path: "cli/lib/plan_validator.py:83"
    schema_field: "frontmatter.drive / VALID_DRIVES enum (10 種)"
    grep_pattern: "^drive:\\s*(be|fe|fullstack|discovery|scrum|db|agent|reverse|poc|troubleshoot)$"
    implementation_status: "installed / migration target"
  - term: "artifact"
    definition: "V-model 4 種 (設計 / 実装 / テスト設計 / テストコード)、frontmatter 実体は 15+ enum"
    cli: "helix doctor check_vmodel_4artifact (vmodel_lint.py 経由)"
    file_path: "N/A (frontmatter 経由)"
    schema_field: "frontmatter.generates.artifact_type / VALID_ARTIFACT_TYPES enum"
    grep_pattern: "artifact_type:\\s*([a-z_]+)"
    implementation_status: "installed"
  - term: "pair freeze"
    definition: "V-model 設計層 ↔ 検証層の対凍結 (6 対)"
    cli: "helix doctor check_vmodel_pair_freeze / helix doctor check_pair_freeze"
    file_path: "N/A (frontmatter 経由)"
    schema_field: "frontmatter.pairs_test_design / frontmatter.pairs_with"
    grep_pattern: "pairs_(test_design|with):\\s*"
    implementation_status: "installed"
  - term: "balance_ratio"
    definition: "量閉じ性指標 (test_count / design_count ≥ 1.0、Chargaff 比喩)"
    cli: "helix doctor balance_ratio (L4 carry: 専用 flag 新設)"
    file_path: "N/A (view 経由)"
    schema_field: "pair_volume_balance view"
    grep_pattern: "balance_ratio\\s*[≥=]\\s*1\\.0"
    implementation_status: "L4-carry"
  - term: "NSM"
    definition: "North Star Metric (V-model 整合 PLAN 完遂数の 6 axes)"
    cli: "helix nsm (cli/helix-nsm 不在、L4 carry)"
    file_path: "cli/config/north-star.yaml"
    schema_field: "N/A (L4 carry)"
    grep_pattern: "North Star|NSM"
    implementation_status: "not-implemented"
  - term: "guardrail"
    definition: "3 軸独立 fail-close (Pair Freeze / Agent Error Budget / TTFSP)"
    cli: "helix gate --readiness-mode enforce (代替実装、cli/config/guardrail.yaml 不在)"
    file_path: "cli/config/guardrail.yaml"
    schema_field: "N/A (L4 carry)"
    grep_pattern: "guardrail|Pair Freeze|TTFSP"
    implementation_status: "partial"
  - term: "trace"
    definition: "4 artifact 間の双方向 reference (① ↔ ② / ① ↔ ③ / ③ ↔ ④)"
    cli: "helix doctor check_vmodel_4artifact + check_parent_design_existence"
    file_path: "N/A (frontmatter 経由)"
    schema_field: "frontmatter.parent_design / frontmatter.next_pair_freeze"
    grep_pattern: "parent_design:|next_pair_freeze:"
    implementation_status: "partial"
  - term: "drift"
    definition: "設計 doc と実体 (code / PLAN / registry) のズレ"
    cli: "helix doctor check_plan_drift / helix doctor check_document_drift / helix drift-check"
    file_path: "N/A (検出器多数)"
    schema_field: "plan_drift_advisory view"
    grep_pattern: "drift|advisory"
    implementation_status: "partial"
  - term: "carry"
    definition: "次工程に持ち越す未確定項目 (P0 / P1 / P2 / P3 4 段)"
    cli: "helix debt / helix doctor の各 check で carry 検出"
    file_path: ".helix/audit/deferred-findings.yaml"
    schema_field: "deferred_findings table"
    grep_pattern: "P[0-3]\\b.*carry|deferred"
    implementation_status: "installed"
  - term: "readiness"
    definition: "工程 entry/exit 条件の機械判定可能性"
    cli: "helix gate <NN> --static-only / --readiness-mode <advisory|enforce>"
    file_path: "cli/lib/deliverable_gate.py"
    schema_field: "static_subchecks / gate_runs.readiness_mode"
    grep_pattern: "readiness|static_subchecks"
    implementation_status: "installed"
  - term: "agent_slot"
    definition: "並列実行可能な特化エージェント slot (mandatory 10 / on-demand 4)。§12 正本用語、L1 §10 entity 名と同一"
    cli: "helix agent <fire|fire-mandatory|suggest|slots|release|audit>"
    file_path: ".claude/agents/*.md"
    schema_field: "agent_slots table + plan_agent_slots table"
    grep_pattern: "agent_slot|subagent"
    implementation_status: "installed"
  - term: "handover"
    definition: "PM ↔ TL ↔ 実装担当 の作業引き渡し protocol"
    cli: "helix handover <dump|status|update|resume|escalate|clear|compaction-sync>"
    file_path: ".helix/handover/CURRENT.json + .helix/handover/archive/"
    schema_field: "N/A (.helix/handover/ JSON state)"
    grep_pattern: "handover"
    implementation_status: "installed"
  - term: "sprint"
    definition: "L7 実装工程内の機能 PLAN (L7-<機能名>plan)、Step 1-8 標準構造"
    cli: "helix sprint <status|next|complete|reset|addon>"
    file_path: "docs/plans/L7/L7-*plan.md"
    schema_field: "sprint_progress table + sprint_metrics table"
    grep_pattern: "^L7-.*plan\\.md$|sprint"
    implementation_status: "installed"
  - term: "phase"
    definition: "現在の工程進捗 (Phase 0-4 / R / L<NN> + workflow 別)"
    cli: "helix gate (進捗判定)"
    file_path: ".helix/phase.yaml + .helix/framework.yaml"
    schema_field: "phase_gate_runs table"
    grep_pattern: "^Phase:|^phase:|process_layer:"
    implementation_status: "installed"
  - term: "IIP / deferral"
    definition: "既知の未解決事項 (Improvement In Progress / 意図的 deferral) の registry"
    cli: "helix debt / helix doctor の deferred 検出"
    file_path: ".helix/audit/deferred-findings.yaml"
    schema_field: "deferred_findings table"
    grep_pattern: "IIP|deferral|deferred"
    implementation_status: "installed"
  - term: "ADR"
    definition: "アーキテクチャ決定記録 (Michael Nygard 2011)、L2 大局判断の snapshot"
    cli: "helix adr (cli/helix-adr 不在、L4 carry)"
    file_path: "docs/adr/ADR-001〜043.md"
    schema_field: "frontmatter.adr_snapshot"
    grep_pattern: "^ADR-[0-9]+"
    implementation_status: "partial"
bounded_contexts:
  - name: "Forward"
    kind: "forward"
    unique_terms:
      - "§12 全用語使用"
      - "L0-L14 全工程"
    anti_corruption_via: "(本体)"
  - name: "Scrum"
    kind: "derived"
    unique_terms:
      - "sprint goal"
      - "iteration"
      - "increment"
      - "velocity"
    anti_corruption_via: "§12 PLAN / gate / artifact 経由で Forward L1 へ"
  - name: "Discovery"
    kind: "derived"
    unique_terms:
      - "hypothesis"
      - "PoC"
      - "verify script"
      - "confirmed-rejected"
    anti_corruption_via: "§12 PLAN 経由で Forward L1 (confirmed → 昇格)"
  - name: "Reverse"
    kind: "derived"
    unique_terms:
      - "characterization tests"
      - "observed contract"
      - "intent hypothesis"
      - "RGC closure"
    anti_corruption_via: "§12 artifact / trace 経由で Forward L1/L3/L4/L7/L8-L11"
  - name: "Incident"
    kind: "derived"
    unique_terms:
      - "hotfix"
      - "postmortem"
      - "RCA"
      - "kill switch"
      - "3 経路並走"
    anti_corruption_via: "§12 gate (G7) + L14 (postmortem) 経由"
  - name: "Add-feature"
    kind: "derived"
    unique_terms:
      - "add-design"
      - "add-impl"
      - "boundary contract"
      - "互換期間"
    anti_corruption_via: "§12 artifact / pair freeze 経由"
  - name: "Refactor"
    kind: "derived"
    unique_terms:
      - "smell"
      - "behavior preservation"
      - "safety net test"
    anti_corruption_via: "§12 trace / pair freeze 経由"
  - name: "Retrofit"
    kind: "derived"
    unique_terms:
      - "retrofit matrix"
      - "migration phase"
      - "compatibility window"
    anti_corruption_via: "§12 PLAN kind=retrofit / generates 経由"
  - name: "Research"
    kind: "derived"
    unique_terms:
      - "hypothesis"
      - "decision (Accepted / Superseded)"
      - "option"
    anti_corruption_via: "§12 ADR snapshot 経由で L0/L4 採用判断"
  - name: "Recovery"
    kind: "derived"
    unique_terms:
      - "trigger 4 種 (想定外大規模 / 工程逸脱 / 認識ズレ / 予算超過)"
      - "kill switch"
    anti_corruption_via: "§12 handover / PLAN 経由"
