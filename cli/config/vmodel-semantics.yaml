            - pmo-project-explorer
          recommended_agents:
            - tl-advisor
          recommended_skills:
            - workflow/design-doc
            - workflow/api-contract
            - workflow/adversarial-review
            - workflow/threat-model
            - agent-skills/api-and-interface-design
            - agent-skills/system-design-sizing
          recommended_commands:
            - helix gate
            - helix drift-check
          orchestration_mode: claude_judge_codex_impl
      detailed:
        design:
          artifacts:
            - api_contract
            - service_flow
            - error_contract
            - persistence_boundary
          review_unit: api_endpoint
          review_axes:
            - vertical
            - horizontal
          detectors:
            - axis-06-naming-confusion
            - axis-07-contract-drift
            - axis-12-connection-deficiency
        test:
          test_level: integration
          artifacts:
