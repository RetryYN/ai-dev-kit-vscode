            - workflow/requirements-deriver
            - workflow/api-contract
            - workflow/requirements-handover
          recommended_commands:
            - helix plan
            - helix gate
          orchestration_mode: claude_judge
      architecture:
        design:
          artifacts:
            - architecture_decision_record
            - api_overview
            - sequence_diagram
            - component_diagram
          review_unit: api_subsystem
          review_axes:
            - vertical
            - horizontal
          detectors:
