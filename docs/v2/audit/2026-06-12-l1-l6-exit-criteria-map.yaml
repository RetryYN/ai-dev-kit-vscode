    machine_evidence:
      - docs/v2/audit/2026-06-12-l1-l6-pair-balance-map.yaml
    pass_conditions:
      - system / component grain is explicit
      - system-test-design exists
      - semantic ST-to-TV-to-L4 transitive trace is accepted and monitored
    verdict: pass_with_monitoring
  - layer: L5
    exit_gate: G5
    design_scope: detailed / internal design and integration-test-design
    required_artifacts:
      - docs/v2/L5-detailed-design/IF詳細設計.md
