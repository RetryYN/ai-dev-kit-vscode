invariants:
  - Every required_artifacts path must exist.
  - Every paired_test_design_artifacts path must exist unless the layer has an explicit waiver.
  - This map is exit-criteria evidence only; it cannot be used as L7 implementation or execution evidence.
  - Later-phase work must stay behind add-feature approval.
completion_denial:
  reason: >
    This map proves G1-G6 exit criteria for the current L1-L6 design scope
    only. It does not prove L7 implementation, unit-test execution, coverage
    closure, HELIX DB write adoption, external tool execution, or full
    objective completion.
