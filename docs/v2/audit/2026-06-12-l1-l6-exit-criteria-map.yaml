      - docs/v2/L5-detailed-design/harness-external-tools-impact-詳細設計.md
    paired_test_design_artifacts:
      - docs/v2/L8-test-design/L5-detailed-design-結合テスト設計.md
    machine_evidence:
      - docs/v2/audit/2026-06-12-l1-l6-pair-balance-map.yaml
    pass_conditions:
      - module / integration grain is explicit
      - integration-test-design exists
      - L5-L8 pair has no missing pair for current scope
    verdict: pass
  - layer: L6
    exit_gate: G6
    design_scope: function design / specification and unit-test-design viewpoints
    required_artifacts:
