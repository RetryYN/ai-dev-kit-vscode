  current_scope_action: map_import_targets_only
invariants:
  - This audit does not change cli/lib/plan_registry.py.
  - This audit does not write to .helix/helix.db.
  - Draft add-feature tickets are not implementation evidence.
  - Add-feature import behavior requires approved L7 TDD implementation.
completion_denial:
  reason: >
    This audit proves DB registration readiness mapping only. It does not prove
    add-feature ticket import implementation, HELIX DB write adoption, schema
    migration, hook execution, CI/equivalent wiring, or full goal completion.
