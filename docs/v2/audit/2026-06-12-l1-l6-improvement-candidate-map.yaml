adoption_requirements:
  - Candidate must be promoted to an approved PLAN or add-feature ticket with owner, scope, allowed_files, acceptance, rollback, and verification commands.
  - External tools require explicit approval for auth, credential scope, network execution, license, and CI/security surface.
  - HELIX DB write connection or schema migration requires separate human approval.
  - Candidate generation alone must remain non-closure until gate evidence and recurrence status are recorded.
