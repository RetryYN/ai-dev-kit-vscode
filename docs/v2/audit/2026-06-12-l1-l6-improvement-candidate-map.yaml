schema_version: l1_l6_improvement_candidate_map_v1
owner: TL
status: current_scope_l1_l6_candidates_not_adopted
updated: 2026-06-12
scope: L1-L6
purpose: >
  Capture feasible improvement candidates found while auditing the current
  L1-L6 design scope, without using L7 test-design artifacts as the source of
  truth. The candidates are discovery/design evidence only. Adoption,
  installation, implementation, CI connection, DB write connection, and closure
  require an approved feature or later-layer PLAN.
sources:
  web_evidence:
    - docs/v2/audit/2026-06-12-l1-l6-web-evidence-source-map.yaml
  l6_design:
    - docs/v2/L6-functional-design/db-backed-evidence-lifecycle-機能設計.md
    - docs/v2/L6-functional-design/harness-external-tools-impact-機能設計.md
    - docs/v2/L6-functional-design/FR-TDD-01/function-spec.md
    - docs/v2/L6-functional-design/FR-IMPACT-01/function-spec.md
    - docs/v2/L6-functional-design/FR-GATE-01/function-spec.md
    - docs/v2/L6-functional-design/FR-FNREG-01/function-spec.md
    - docs/v2/L6-functional-design/FR-GLOSSARY-01/function-spec.md
  deferred_feature_entry_points:
    - docs/plans/add-feature/add-feature-2026-06-10-db-backed-evidence-lifecycle-l7.md
    - docs/plans/add-feature/add-feature-2026-06-10-harness-external-tools-ddd-tdd-impact.md
    - docs/plans/add-feature/add-feature-2026-06-12-fr-registry-glossary-l7-entry.md
    - docs/plans/add-feature/add-feature-2026-06-12-dependency-impact-query-l7.md
    - docs/plans/add-feature/add-feature-2026-06-12-bottleneck-routing-l7.md
boundary:
  uses_l7_test_design_as_source: false
  candidates_discovered: true
  candidates_adopted: false
  l7_work_requested_by_user: false
  l7_work_requires_feature_ticket: true
  external_tool_installed: false
  helix_db_write_connected: false
  ci_or_equivalent_connected: false
  goal_complete_allowed: false
candidate_discovery_policy:
  intake_triggers:
    - l6_design_gap
    - web_backed_tool_opportunity
    - db_feedback_or_workflow_automation_gap
    - runtime_guard_parity_gap
    - bottleneck_signal_routing_gap
  required_candidate_fields:
    - id
    - title
    - objective_mapping
    - source_refs
    - l1_l6_design_status
    - current_scope_action
    - deferred_feature_plan
    - why_it_matters
    - safety
  allowed_current_scope_actions:
    - design_only
    - feature_ticket_only
  allowed_source_groups:
    - web_evidence
    - l6_design
    - deferred_feature_entry_points
  safety_fields_required:
    - schema_migration
    - infrastructure_change
    - auth_or_pii_change
  disallowed_evidence:
    - docs/v2/L7-test-design/
    - runtime execution without approval
    - helix db write proof
    - external tool install proof
  promotion_policy:
    design_only: >
      May close L1-L6 design readiness only; execution, DB writes, external
      tool runs, and closure still require approved later-layer work.
    feature_ticket_only: >
      Must stay draft/approval-boundary and cannot count as adoption,
      installation, implementation, gate pass, or recurrence closure.
  closure_rule: >
    Candidate discovery is not closure. A candidate becomes closure evidence
    only after approved implementation, verification, gate evidence, and
    feedback/recurrence status exist.
candidate_summary:
  total_candidates: 35
  current_scope_actions:
    design_only: 2
    feature_ticket_only: 33
  candidates_requiring_confirmation: 33
