      - DDD
      - bounded_context
      - FN-DDD
    current_scope_status: l6_design_or_preexisting_pair_not_new_l7
  - control_id: tdd_order
    source_artifact: docs/v2/L6-functional-design/FR-TDD-01/function-spec.md
    required_terms:
      - failing_test_observed
      - "full_goal_completion_allowed: false"
      - テスト設計またはテスト stub なしで実装 step
      - feedback append は closure に昇格しない
    current_scope_status: l6_design_only_not_l7_execution
