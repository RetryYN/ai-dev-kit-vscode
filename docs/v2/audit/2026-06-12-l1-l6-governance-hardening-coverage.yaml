    source_artifact: docs/v2/L6-functional-design/FR-IMPACT-01/function-spec.md
    required_terms:
      - dependency_edges
      - source -> target -> relation -> confidence
      - PLAN / design / test-design / code / gate / feedback
      - unknown を local と偽装しない
