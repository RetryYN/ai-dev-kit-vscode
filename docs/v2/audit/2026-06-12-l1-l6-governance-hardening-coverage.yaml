coverage_controls:
  coding_rule_registry:
    expected_registry_entries: 14
    status: designed_or_preexisting_warn_only
  ddd_registry:
    expected_glossary_terms_min: 19
    expected_bounded_contexts: 10
    status: designed_or_preexisting_warn_only
  tdd_order:
    forbidden_transitions_defined: true
    failing_test_required_before_implementation: true
    closure_denied_without_test_pass: true
  auto_registration:
    functional_registry_required: true
    glossary_registry_required: true
    db_feedback_append_only: true
    add_feature_ticket_import_deferred_plan: docs/plans/add-feature/add-feature-2026-06-12-plan-registry-add-feature-import-l7.md
    ticket_registration_is_completion_evidence: false
  impact_visibility:
    dependency_edges_required: true
    affected_artifacts_and_gates_separated: true
    unknown_scope_not_treated_as_local: true
  doc_review_quality:
    four_viewpoints_required: true
    blocked_result_not_advisory: true
    review_evidence_is_completion: false
    reviewer_read_only_required: true
documentation_readiness_detection_matrix:
  current_scope_action: map_user_doc_governance_request_to_existing_l1_l6_controls
  matrix_is_l7_work: false
  detector_execution_added_now: false
  fail_close_promotion_added_now: false
  db_write_added_now: false
  rows_checked: 7
  rows:
    - gap_pattern: missing_function_registry_entry
      detecting_control: auto_registration
      primary_governance_surface: GOV-FUNCTION-REGISTRY
      finding_types:
        - undefined_fr
        - duplicate_fr
        - registry_drift
        - missing_asset
        - reverse_leak
        - status_mismatch
      feedback_route: append_fnreg_feedback
      completion_boundary: L6_design_only_l7_cli_db_ci_deferred
    - gap_pattern: missing_document_review_or_quality_scope
      detecting_control: doc_review_quality
      primary_governance_surface: GOV-DOC-REVIEW
      finding_types:
        - missing_doc_review_scope
        - p0_downgraded_to_conditional
        - missing_four_viewpoint_findings
        - missing_vmodel_quantity_closure
        - read_only_boundary_missing
      feedback_route: append_doc_review_feedback
      completion_boundary: L6_design_only_reviewer_runtime_deferred
    - gap_pattern: missing_ddd_or_glossary_registry_coverage
      detecting_control: ddd_registry
      primary_governance_surface: GOV-DDD-REGISTRY
      secondary_governance_surface: GOV-GLOSSARY
      finding_types:
        - undefined_term
        - bounded_context_drift
        - anti_corruption_violation
        - registry_mirror_drift
        - missing_reference
      feedback_route: append_glossary_feedback
      completion_boundary: L6_design_only_glossary_cli_db_deferred
    - gap_pattern: missing_coding_rule_or_enforcement_metadata
      detecting_control: coding_rule_registry
      primary_governance_surface: GOV-CODING-RULE
      finding_types:
        - missing_rule
        - duplicate_rule
        - stale_rule_status
        - rule_source_missing
      feedback_route: coding_rule_detector_report
      completion_boundary: L6_design_only_fail_close_deferred
    - gap_pattern: tdd_order_violation_or_test_after_implementation
      detecting_control: tdd_order
      primary_governance_surface: GOV-TDD-ORDER
      finding_types:
        - missing_test_design_or_stub
        - missing_failing_test_observation
        - implementation_before_test
        - closure_without_test_pass
      feedback_route: append_tdd_feedback
      completion_boundary: L6_design_only_unit_execution_deferred
    - gap_pattern: missing_dependency_or_impact_edge
      detecting_control: impact_visibility
      primary_governance_surface: GOV-IMPACT
      finding_types:
        - missing_dependency_edge
        - unknown_scope
        - missing_affected_artifact
        - missing_required_gate
      feedback_route: append_impact_feedback
      completion_boundary: L6_design_only_impact_query_runtime_deferred
    - gap_pattern: missing_asset_inventory_or_document_projection_metadata
      detecting_control: auto_registration
      primary_governance_surface: GOV-INVENTORY
      finding_types:
        - missing_document_projection
        - missing_process_layer
        - missing_pairs_with
        - missing_implementation_status
      feedback_route: append_inventory_feedback
      completion_boundary: L6_design_only_document_projection_write_deferred
governance_detection_policy:
  current_scope_action: define_l6_detection_contract_only
  detector_execution_added_now: false
  fail_close_promotion_added_now: false
  db_write_added_now: false
  route_to_gate_input: true
  route_to_feedback_candidate: true
  candidate_is_not_closure: true
  allowed_severities:
    - P0
    - P1
    - P2
    - P3
  required_route_fields:
    - control_id
    - finding_types
    - severity_floor
    - source_artifact
    - gate_inputs
    - feedback_behavior
    - completion_boundary
  completion_boundary_rule: >
    Governance findings can become gate inputs and feedback candidates in the
    design contract, but they cannot prove implementation, DB persistence,
    CI/equivalent enforcement, recurrence closure, or full-goal completion.
