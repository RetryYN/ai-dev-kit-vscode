      - BTL-SIG-PLAN-REGISTRY
    aggregate_signal: doc_connection_gap
    routed_mode: Reverse
    priority_floor: P1
    next_plan_or_feature_ticket: docs/plans/add-feature/add-feature-2026-06-12-plan-registry-add-feature-import-l7.md
    completion_boundary: aggregate_signal_is_not_remediation_closure
  - aggregate_id: BTL-AGG-REGRESSION-DEPENDENCY
    input_axes:
      - axis-10
      - axis-11
    input_signal_ids:
