    - docs/v2/audit/2026-06-12-l1-l6-workflow-automation-coverage.yaml
    - docs/v2/audit/2026-06-12-l1-l6-db-feedback-lifecycle-coverage.yaml
    - docs/v2/audit/2026-06-12-full-objective-gap-status.yaml
