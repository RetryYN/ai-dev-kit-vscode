invariants:
  - A bottleneck candidate is not remediation closure.
  - Unknown or broad impact scope must not be auto-applied.
  - Candidate ownership, affected layer/pair, and next PLAN or feature ticket must be explicit before implementation.
  - Recurrence closure requires post-implementation evidence and cannot be produced by this L1-L6 audit.
completion_denial:
  reason: >
    This audit proves L1-L6 bottleneck remediation readiness only. It does not
    prove bottleneck detector implementation, auto-apply, HELIX DB write
    adoption, external tool execution, CI/equivalent wiring, recurrence
    closure, L7 test design, or full goal completion.
