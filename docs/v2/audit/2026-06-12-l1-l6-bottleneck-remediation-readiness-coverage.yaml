      - BTL-SIG-DEPENDENCY-IMPACT
    aggregate_signal: drift_degradation
    routed_mode: Reverse
    priority_floor: P1
    next_plan_or_feature_ticket: docs/plans/add-feature/add-feature-2026-06-12-bottleneck-routing-l7.md
    completion_boundary: aggregate_signal_is_not_remediation_closure
  - aggregate_id: BTL-AGG-DOC-CONNECTION
    input_axes:
      - axis-07
      - axis-12
    input_signal_ids:
