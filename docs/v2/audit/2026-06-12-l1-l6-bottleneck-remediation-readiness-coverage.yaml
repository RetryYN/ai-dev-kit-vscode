    aggregate_signal: regression_dependency
    routed_mode: Recovery
    priority_floor: P0
    next_plan_or_feature_ticket: docs/plans/add-feature/add-feature-2026-06-10-full-flow-remaining-guards.md
    completion_boundary: aggregate_signal_is_not_remediation_closure
  - aggregate_id: BTL-AGG-FEEDBACK-LOOP
    input_axes:
      - axis-11
      - axis-12
    input_signal_ids:
      - BTL-SIG-DB-FEEDBACK
      - BTL-SIG-HARNESS-TOOLS
