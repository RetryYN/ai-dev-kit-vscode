    - docs/plans/add-feature/add-feature-2026-06-10-harness-external-tools-ddd-tdd-impact.md
    - docs/plans/add-feature/add-feature-2026-06-10-full-flow-remaining-guards.md
    - docs/plans/add-feature/add-feature-2026-06-12-bottleneck-routing-l7.md
boundary:
  l7_work_requested_by_user: false
  l7_work_requires_feature_ticket: true
  bottleneck_map_is_implementation_evidence: false
  bottleneck_detector_implemented_by_this_audit: false
  remediation_auto_apply_done: false
  helix_db_write_performed: false
  schema_migration_done: false
  external_tool_executed: false
  ci_or_equivalent_connected: false
  l7_test_design_created_by_this_audit: false
  goal_complete_allowed: false
summary:
  bottleneck_signal_sources_checked: 7
  l6_function_specs_checked: 5
  remediation_flow_states_defined: 7
  forbidden_current_scope_states_checked: 2
  required_signal_fields_checked: 8
  cross_axis_aggregation_contracts_checked: 4
  signal_route_contracts_checked: 7
  current_code_surfaces_checked_read_only: 5
  deferred_feature_entry_points_checked: 4
  deferred_feature_boundaries_checked: 4
  required_output_sections: 8
  blocking_findings_current_scope: 0
  l7_artifacts_created_by_this_audit: 0
bottleneck_signal_sources:
  - id: BTL-SIG-REQ-DRIFT
    signal: requirement_drift blocking/advisory findings
    current_l1_l6_evidence: docs/v2/audit/2026-06-12-l1-l6-fr31-trace-map.yaml
    candidate_route: route_bottleneck_candidate
    current_scope_status: clean_signal_source_available
  - id: BTL-SIG-PAIR-BALANCE
    signal: trace_symmetry pair imbalance / semantic exclusion pressure
    current_l1_l6_evidence: docs/v2/audit/2026-06-12-l1-l6-pair-balance-map.yaml
    candidate_route: route_bottleneck_candidate
    current_scope_status: clean_with_monitoring
  - id: BTL-SIG-FULL-FLOW-DEFERRED
    signal: G8/G9/G12/G14 strict full-flow deferred gates
    current_l1_l6_evidence: docs/v2/audit/2026-06-12-full-objective-gap-status.yaml
    candidate_route: full_flow_remaining_guards_feature_ticket
    current_scope_status: deferred_not_closure
  - id: BTL-SIG-DB-FEEDBACK
    signal: candidate/adoption/recurrence lifecycle gaps
    current_l1_l6_evidence: docs/v2/audit/2026-06-12-l1-l6-db-feedback-lifecycle-coverage.yaml
    candidate_route: db_evidence_lifecycle_feature_ticket
    current_scope_status: design_covered_implementation_deferred
  - id: BTL-SIG-DEPENDENCY-IMPACT
    signal: broad/unknown impact scope and missing dependency edges
    current_l1_l6_evidence: docs/v2/audit/2026-06-12-l1-l6-dependency-impact-readiness-coverage.yaml
    candidate_route: impact_query_or_external_tool_feature
    current_scope_status: design_covered_query_deferred
  - id: BTL-SIG-HARNESS-TOOLS
    signal: external tool admission, output normalization, tool poisoning, license, auth, CI boundary
    current_l1_l6_evidence: docs/v2/audit/2026-06-12-l1-l6-harness-external-tools-coverage.yaml
    candidate_route: harness_external_tools_feature_ticket
    current_scope_status: candidate_requires_approval
  - id: BTL-SIG-PLAN-REGISTRY
    signal: add-feature ticket import gap / PLAN dependency graph incompleteness
    current_l1_l6_evidence: docs/v2/audit/2026-06-12-l1-l6-db-registration-readiness-coverage.yaml
    candidate_route: plan_registry_add_feature_import_ticket
    current_scope_status: import_gap_ticketed
remediation_flow:
  states:
    - signal_detected
    - normalized_bottleneck_candidate
    - impact_scope_ranked
    - owner_and_layer_assigned
    - feature_ticket_or_plan_materialized
    - approved_implementation_executed
    - recurrence_closed
  current_scope_terminal_state: feature_ticket_or_plan_materialized
  forbidden_current_scope_states:
    - approved_implementation_executed
    - recurrence_closed
l6_design_coverage:
  - id: BTL-FN-ROUTE
    artifact: docs/v2/L6-functional-design/harness-external-tools-impact-機能設計.md
    covered_functions:
      - HEXT-FN-07 route_bottleneck_candidate
      - HEXT-FN-08 emit_external_tool_guard_summary
      - HEXT-FN-10 evaluate_tool_execution_risk
    current_scope_result: Candidate routing is designed; no auto-apply or tool execution.
  - id: BTL-FN-LIFECYCLE
    artifact: docs/v2/L6-functional-design/db-backed-evidence-lifecycle-機能設計.md
    covered_functions:
      - candidate_generated
      - plan_materialized
      - verification_recorded
      - recurrence_closed
    current_scope_result: Lifecycle states are designed; DB write and recurrence closure remain deferred.
  - id: BTL-FN-GATE
    artifact: docs/v2/L6-functional-design/FR-GATE-01/function-spec.md
    covered_functions:
      - gate verdict synthesis
      - quantitative / qualitative double-check
      - candidate-vs-closure separation
    current_scope_result: Bottleneck candidates cannot be treated as gate pass.
  - id: BTL-FN-IMPACT
    artifact: docs/v2/L6-functional-design/FR-IMPACT-01/function-spec.md
    covered_functions:
      - collect_dependency_edges
      - rank_impact_scope
      - append_impact_feedback
    current_scope_result: Impact scope can guide prioritization after approved implementation.
  - id: BTL-FN-CHANGE-PROPAGATION
    artifact: docs/v2/L6-functional-design/FR-CHANGEPROP-01/function-spec.md
    covered_functions:
      - resolve_downstream_obligations
      - affected layer / pair / gate preservation
      - baseline regression separation
    current_scope_result: Regression pressure can become bottleneck evidence without closure claim.
required_output_contract:
  signal_id: required
  source_evidence: required
  bottleneck_category: required
  affected_layer_or_pair: required
  impact_scope: required
  candidate_owner: required
  next_plan_or_feature_ticket: required
  completion_boundary: required
signal_classification_policy:
  current_scope_action: classify_and_route_design_only
  detector_execution_added_now: false
  auto_apply_allowed_now: false
  db_write_allowed_now: false
  recurrence_closure_allowed_now: false
  required_signal_fields:
    - signal_id
    - source_evidence
    - bottleneck_category
    - affected_layer_or_pair
    - impact_scope
    - candidate_owner
    - next_plan_or_feature_ticket
    - completion_boundary
  allowed_categories:
    - requirement_trace
    - pair_balance
    - deferred_execution_gate
    - feedback_lifecycle
    - dependency_impact
    - external_tool_admission
    - plan_registry
  allowed_impact_scope:
    - local
    - broad
    - unknown
    - full_flow_deferred
  owner_roles:
    - TL
    - QA
    - DevOps
    - Security
  closure_policy: >
    A classified bottleneck can become a PLAN or add-feature candidate, but
    cannot become remediation closure without approved implementation,
    verification evidence, gate projection, and recurrence observation.
cross_axis_aggregation_policy:
  current_scope_action: define_cross_detection_contract_only
  cross_detector_implemented_now: false
  route_auto_execute_allowed_now: false
  db_write_allowed_now: false
  required_fields:
    - aggregate_id
    - input_axes
    - input_signal_ids
    - aggregate_signal
    - routed_mode
    - priority_floor
    - next_plan_or_feature_ticket
    - completion_boundary
  allowed_axes:
    - axis-07
    - axis-10
    - axis-11
    - axis-12
  allowed_aggregate_signals:
    - drift_degradation
    - doc_connection_gap
    - regression_dependency
    - runaway_feedback_loop
  allowed_modes:
    - Reverse
    - Recovery
    - Incident
  allowed_priority_floor:
    - P0
    - P1
    - P2
