validation_contract:
  ticket_set_source: docs/v2/audit/2026-06-12-l1-l6-deferred-feature-coverage.yaml#feature_ticket_integrity
  row_ticket_ids_must_equal_deferred_feature_ticket_ids: true
  every_prior_l1_l6_design_evidence_path_must_exist: true
  every_ticket_path_must_exist: true
  current_scope_verdict_allowed:
    - prior_design_present_defer_execution
    - prior_design_present_defer_db_write
    - prior_design_present_defer_external_adoption
    - prior_design_present_defer_runtime_enforcement
    - prior_design_present_defer_registry_write
    - prior_design_present_defer_plan_registry_change
    - prior_design_present_defer_query_implementation
    - prior_design_present_defer_routing_execution
    - prior_design_present_defer_l7_unit_closure
    - prior_design_present_defer_runtime_retrofit
    - prior_design_present_defer_contract_edit
completion_denial:
  reason: >
    This audit proves that current draft add-feature routes have prior L1-L6
    design evidence and are not design-debt escape hatches. It does not prove
    L7 implementation, L7 unit-test implementation/execution, coverage
    closure, HELIX DB write adoption, external tool adoption, CI/equivalent
    connection, contract edit completion, recurrence closure, or full-goal
    completion.
