schema_version: l1_l6_deferred_design_obligation_proof_v1
owner: TL
status: current_scope_l1_l6_design_obligations_proven_before_defer
updated: 2026-06-13
scope: L1-L6
purpose: >
  Prove that draft add-feature tickets are not being used to hide L1-L6
  design debt. Every deferred route must have current L1-L6 design evidence
  before it can be treated as a later-phase implementation, DB, CI, external
  tool, or contract-edit boundary.
sources:
