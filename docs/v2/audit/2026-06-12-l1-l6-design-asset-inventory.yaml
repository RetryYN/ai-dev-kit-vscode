preexisting_l7_pair_references:
  policy: >
    Existing L6 documents may name their paired L7 test-design artifact because
    HELIX pair-freeze uses L6-L7 pairing. In this current user-requested scope,
    those references are inventory metadata only and cannot be used as approval
    to create or execute L7 work.
  must_route_new_l7_work_to:
    - docs/plans/add-feature/add-feature-2026-06-12-fr-registry-glossary-l7-entry.md
    - docs/plans/add-feature/add-feature-2026-06-10-db-backed-evidence-lifecycle-l7.md
    - docs/plans/add-feature/add-feature-2026-06-10-harness-external-tools-ddd-tdd-impact.md
l6_l7_reference_boundary:
  l6_docs_with_l7_refs: 24
  l7_ref_occurrences_in_l6_docs: 29
  unique_l7_ref_targets: 24
  existing_pair_artifact_targets: 6
  future_placeholder_targets: 18
  existing_pair_policy: >
    Existing pair artifacts are historical / pre-existing evidence only. This
    inventory does not use them as current-scope completion evidence.
  future_placeholder_policy: >
    Missing FR-scoped pair targets are allowed only when the L6 source states
    that the L7 test-design artifact is not created in the current task.
  current_audit_created_l7_pair_artifacts: false
  current_scope_uses_l7_refs_as_completion_evidence: false
future_pair_reference_resolution_contract:
  current_scope_action: classify_only_no_l7_creation
  future_refs_are_design_placeholders: false
  future_refs_are_unapproved_pair_targets: true
  future_refs_are_completion_evidence: false
  l7_artifact_creation_allowed_now: false
  required_source_statement: 現在タスクでは作成しない
  required_resolution_routes:
    - approved_add_feature_ticket
    - approved_l7_plan
  unlock_conditions:
    - user_explicitly_requests_l7_work
    - approved_feature_ticket_names_the_l7_target
    - acceptance_criteria_include_unit_test_design_artifact
  route_policy: >
    FR-scoped L7 pair references found in L6 sources are retained as HELIX
    pair metadata only. If the referenced artifact does not exist, it must
    remain a non-completion boundary until an approved add-feature ticket or
    approved L7 plan names that target.
coverage_evidence:
  requirement_drift:
    clean: true
    focus: L6
    requirements: 31
    design_links: 31
    blocking_findings: 0
    source: docs/v2/audit/2026-06-12-l1-l6-fr31-trace-map.yaml
  grain_balance:
    source: docs/v2/audit/2026-06-12-l1-l6-grain-balance-audit.md
    l1_l6_current_scope_status: pass
completion_denial:
  reason: >
    This inventory proves the L1-L6 asset universe considered by the audit. It
    does not prove L7 execution, unit-test implementation, coverage closure,
    CI/equivalent connection, or external tool adoption.
