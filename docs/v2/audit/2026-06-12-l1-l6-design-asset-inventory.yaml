schema_version: l1_l6_design_asset_inventory_v1
owner: TL
status: current_scope_l1_l6_inventory_not_l7
updated: 2026-06-12
scope: L1-L6
purpose: >
  Inventory the existing L1-L6 design and paired test-design assets used by
  the current requirement-gap and granularity audit. This inventory prevents
  the L1-L6 audit from relying only on selected proof files. It records
  pre-existing L7 pair references as boundary metadata only; it does not
  authorize or perform L7 work.
source_commands:
  asset_listing: "find docs/v2/L{1,2,3,4,5,6}-* -type f"
  requirement_drift: "helix doctor check_requirement_drift --json"
  trace_balance: "python3 -m cli.lib.trace_symmetry --json"
boundary:
  l7_work_requested_by_user: false
  l7_work_requires_feature_ticket: true
  inventory_uses_l7_as_execution_evidence: false
  l7_implementation_done: false
  l7_test_design_created_by_this_inventory: false
  goal_complete_allowed: false
