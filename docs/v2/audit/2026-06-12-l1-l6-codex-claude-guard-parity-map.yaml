schema_version: l1_l6_codex_claude_guard_parity_map_v1
owner: TL
status: current_scope_l1_l6_guard_parity_defined
updated: 2026-06-12
scope: L1-L6
purpose: >
  Make the "works in ClaudeCode but not Codex" guard surface inspectable for
  the current L1-L6 audit. This map records which controls already have Codex
  runtime evidence, which are L6 design contracts only, and which must remain
  future feature/PLAN work before they can count as parity closure.
