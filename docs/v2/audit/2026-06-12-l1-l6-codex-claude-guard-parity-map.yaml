guard_surfaces:
  - id: GPAR-COMMON-RUNTIME-RULES
    title: Common HELIX runtime rules apply to ClaudeCode and Codex.
    parity_status: defined_common_policy
    current_scope_status: L1-L6 evidence
    source_refs:
      - AGENTS.md
      - helix/HELIX_RUNTIME_RULES.md
      - helix/CODEX_RUNTIME_ADAPTER.md
      - skills/SKILL_MAP.md
      - skills/tools/ai-coding/references/gate-policy.md
      - skills/tools/ai-coding/references/implementation-gate.md
      - skills/tools/ai-coding/references/codex-prompt-antipatterns.md
      - skills/tools/ai-coding/references/fork-security-policy.md
    codex_control:
      - Codex is not an independent workflow.
      - Codex must follow HELIX Core, Runtime Rules, handover, PLAN, and gate evidence.
      - Codex must read SKILL_MAP as the workflow/gate/skill index while loading individual SKILL.md files only when triggered.
      - AGENTS.md carries Codex-specific schedule discipline, handover discipline, and compatibility flag boundaries.
      - ai-coding references carry shared gate policy, implementation gate, prompt anti-pattern, and external fork security controls.
    claude_control:
      - Claude Code is also governed by HELIX Runtime Rules.
    current_gap: none_for_policy_definition
  - id: GPAR-CODEX-HARNESS-CONSENT
    title: Codex write execution must go through helix codex guard surfaces.
    parity_status: codex_runtime_defined
    current_scope_status: L1-L6 evidence
    source_refs:
      - helix/CODEX_RUNTIME_ADAPTER.md
    codex_control:
      - "--plan-only for planning / investigation tasks"
      - "--approved for write execution"
      - "--consent auto for plan-only guard"
      - "HELIX_CODEX_REQUIRE_APPROVED=1 for required approval"
      - "raw codex requires HELIX_ALLOW_RAW_CODEX and reason"
    claude_control:
      - "Claude prompt generation uses helix claude --dry-run; raw claude requires reason."
    current_gap: runtime policy documented; broader enforcement remains outside this L1-L6 audit
  - id: GPAR-HANDOVER-METADATA-BOUNDARY
    title: Handover Next Action must override stale legacy metadata when Codex resumes.
    parity_status: defined_common_policy
    current_scope_status: L1-L6 evidence
    source_refs:
      - .helix/handover/CURRENT.md
      - .helix/handover/CURRENT.json
      - docs/v2/audit/2026-06-13-l1-l6-legacy-reference-classification.yaml
      - docs/plans/add-feature/add-feature-2026-06-13-phase-enum-l0-l14-runtime-retrofit.md
    codex_control:
      - CURRENT.md Next Action is authoritative for current scope.
      - Legacy CURRENT.json L7 task title and pending entries cannot authorize L7 work.
      - Safe task retitle / metadata refresh remains future retrofit and cannot be self-applied.
    claude_control:
      - Claude/PM handover metadata can provide context, but current Next Action and explicit user boundary decide scope.
    current_gap: runtime metadata validator and safe retitle command remain future retrofit work
  - id: GPAR-CODEX-DESIGN-WEB-EVIDENCE
    title: Codex design-document Web evidence post-validation.
    parity_status: codex_runtime_tested
    current_scope_status: L1-L6 evidence
    source_refs:
      - helix/CODEX_RUNTIME_ADAPTER.md
      - cli/lib/codex_post_validation.py
      - cli/lib/tests/test_codex_post_validation.py
      - cli/tests/test-helix-codex-write-audit.bats
    codex_control:
      - HELIX_CODEX_DESIGN_WEB_EVIDENCE is checked by post-validation.
      - ADR design doc changes without WebSearch/WebFetch evidence fail.
      - WebSearch and WebFetch evidence both pass.
    claude_control:
      - Claude hook design-doc WebSearch guard exists in whole-source coverage design.
    current_gap: none_for_current_design_doc_web_evidence_surface
  - id: GPAR-CODEX-ALLOWED-FILES-BASELINE
    title: Codex post-validation catches out-of-scope writes and unsafe concurrent baselines.
    parity_status: codex_runtime_tested
    current_scope_status: L1-L6 evidence
    source_refs:
      - cli/lib/codex_post_validation.py
      - cli/lib/tests/test_codex_post_validation.py
    codex_control:
      - allowed_files violations are detected for untracked writes.
      - concurrent baseline files must live under PROJECT_ROOT/.helix/tmp.
      - symlink and invalid baseline paths are rejected.
    claude_control:
      - ClaudeCode hook surface is separate; this map records Codex parity coverage for the same scope-boundary intent.
    current_gap: no L7 change; broader hook parity remains feature/PLAN work
  - id: GPAR-CONTEXT-INJECTION-PARITY
    title: Layer context injection must emit parity findings when only ClaudeCode receives a constraint.
    parity_status: l6_design_only
    current_scope_status: design_closed_implementation_deferred
    source_refs:
      - docs/v2/L6-functional-design/FR-CTX-01/function-spec.md
    codex_control:
      - CTX-FN-05 emits guardrail / doctor input for Codex/Claude parity gaps.
      - CTX-UT-CAND-05 defines the unit-test-design viewpoint.
    claude_control:
      - ClaudeCode hook-only injection must not silently count as HELIX parity.
    current_gap: context bundle implementation, hook/harness connection, and mandatory-agent enforcement require later approved work
  - id: GPAR-GUARDRAIL-PARITY-AXIS
    title: Guardrail evaluation includes Codex / Claude parity as an axis.
    parity_status: l6_design_only
    current_scope_status: design_closed_implementation_deferred
    source_refs:
      - docs/v2/L6-functional-design/FR-GR-01/function-spec.md
    codex_control:
      - Guardrail contract includes codex_claude_parity verdict.
      - Claude-only guard coverage becomes warn or block finding.
    claude_control:
      - Claude-only hook behavior is not allowed to be invisible to gate inputs.
    current_gap: guardrail implementation, doctor/gate/CI connection require later approved work
  - id: GPAR-WSC-HOOK-PARITY-CARRY
    title: Whole-source coverage lists Claude hooks and Codex library guards with known implementation surfaces.
    parity_status: future_plan_required
    current_scope_status: inventory_and_design_only
    source_refs:
      - docs/v2/L6-functional-design/whole-source-coverage-機能設計.md
    codex_control:
      - codex_post_validation is a Codex-side library guard with tests.
      - pretooluse-codex-slot-check is currently warning-only.
    claude_control:
      - ClaudeCode has direct PreToolUse/PostToolUse hook surfaces for several controls.
    current_gap: full hook-to-Codex enforcement parity is not complete and must remain future PLAN work
adoption_requirements:
  - Any new Codex runtime enforcement must be approved as feature/PLAN work with allowed_files and verification commands.
  - Claude hook behavior cannot be counted as Codex parity unless a Codex runtime, harness, doctor, or post-validation evidence path exists.
  - L6 design contracts can close design gaps only; implementation, runtime enforcement, CI/gate connection, and closure remain separate.
  - The deferred feature entry point for L7 implementation is docs/plans/add-feature/add-feature-2026-06-12-codex-claude-guard-parity-l7.md.
completion_denial:
  reason: >
    This map proves current L1-L6 guard parity design and Codex runtime evidence
    surfaces only. It does not prove full hook parity, new runtime enforcement,
    L7 implementation, CI/gate closure, or full goal completion.
