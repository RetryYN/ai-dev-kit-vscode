      - docs/v2/L1-requirements/helix-workflows-technical-requirements.md
      - docs/v2/L1-requirements/helix-workflows-verification-strategy.md
    paired_test_design_assets:
      - docs/v2/L14-test-design/helix-workflows-operational-test-design.md
    trace_pair: L1-L14
    metrics:
      coverage_pct: 100.0
      balance_ratio: 1.0
      missing_pair_count: 0
      orphan_test_count: 0
      excluded_with_reason_count: 36
    verdict: pass
  - layer: L2
    design_grain: screen requirement / wire mock / UI waiver
