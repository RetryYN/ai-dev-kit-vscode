invariants:
  - Unknown impact scope must not be rendered as local.
  - Dependency edges must keep source, target, relation, and confidence.
  - Affected artifacts and required gates must be separated in output.
  - Impact graph or inventory snapshot alone is not closure evidence.
  - Draft feature ticket registration is not implementation completion.
completion_denial:
  reason: >
    This audit proves L1-L6 dependency and impact readiness only. It does not
    prove impact-query implementation, HELIX DB write adoption, external tool
    execution, CI/equivalent wiring, L7 test design, or full goal completion.
