deferred_feature_policy:
  implementation_required_before_fail_close: true
  feature_tickets:
    - id: full_flow_remaining_guards
      path: docs/plans/add-feature/add-feature-2026-06-10-full-flow-remaining-guards.md
      unlocks:
        - G8/G9/G12/G14 execution-gate implementation
        - CI or local equivalent full-flow gate evidence
        - feedback adoption closure evidence
    - id: db_evidence_lifecycle
      path: docs/plans/add-feature/add-feature-2026-06-10-db-backed-evidence-lifecycle-l7.md
      unlocks:
        - DB write connection
        - document auto-registration projection
        - feedback loop candidate persistence
        - recurrence closure implementation
    - id: harness_external_tools
      path: docs/plans/add-feature/add-feature-2026-06-10-harness-external-tools-ddd-tdd-impact.md
      unlocks:
        - MCP/plugin/SAST execution through HARNESS
        - normalized external tool output ingestion
    - id: codex_claude_guard_parity
      path: docs/plans/add-feature/add-feature-2026-06-12-codex-claude-guard-parity-l7.md
      unlocks:
        - remaining runtime guard parity implementation
    - id: fr_registry_glossary
      path: docs/plans/add-feature/add-feature-2026-06-12-fr-registry-glossary-l7-entry.md
      unlocks:
        - registry/glossary execution evidence
    - id: plan_registry_add_feature_import
      path: docs/plans/add-feature/add-feature-2026-06-12-plan-registry-add-feature-import-l7.md
      unlocks:
        - add-feature ticket import through plan_registry
        - draft ticket registration without treating registration as completion
    - id: phase_enum_l0_l14_runtime_retrofit
      path: docs/plans/add-feature/add-feature-2026-06-13-phase-enum-l0-l14-runtime-retrofit.md
      unlocks:
        - safe task retitle / metadata refresh command
        - runtime phase enum metadata validation
        - handover legacy L7 label regression guard
  parked_feature_tickets:
    - id: detector_failclose_ci_gate
      path: docs/plans/add-feature/add-feature-2026-06-08-detector-failclose-ci-gate.md
      status: finalized_parked
      current_task_scope: parked_feature_ticket_only
      approval_required_before_l7_work: true
      approval_required_before_ci_or_fail_close: true
      ticket_is_completion_evidence: false
      unlocks:
        - detector fail-close promotion
        - CI gate connection
        - automation-gate hardening
completion_denial:
  reason: >
    This audit proves only L1-L6 workflow automation design coverage and route
    mapping. It does not prove L7 implementation, right-arm gate execution,
    CI/equivalent wiring, DB write adoption, external tool execution, or full
    goal completion.
