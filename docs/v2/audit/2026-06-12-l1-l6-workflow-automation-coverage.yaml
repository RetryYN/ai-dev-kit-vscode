  right_arm_execution_gate_implementation_done: false
  ci_or_equivalent_connected: false
  helix_db_write_adoption_done: false
  schema_migration_done: false
  external_tool_executed: false
  external_tool_installed: false
  goal_complete_allowed: false
summary:
  workflow_surfaces_checked: 6
  automation_surfaces_checked: 9
  automation_trigger_contracts_checked: 9
  db_registry_targets_mapped: 9
  detector_gate_routes_mapped: 7
  cross_audit_convergence_rows_checked: 6
  deferred_feature_entry_points_checked: 7
  parked_feature_entry_points_checked: 1
  blocking_findings_current_scope: 0
  l7_artifacts_created_by_this_audit: 0
workflow_surfaces:
  - id: WF-FORWARD-L0-L14
    source: HELIX-workflows/HELIX-process-L0-L14.md
    l1_l6_role: Defines L0-L6 left-arm flow and test-design pair expectations.
    automation_connection:
      - plan_registry
      - transition_history
      - gate_pass
      - vmodel_semantics
    current_scope_status: design_contract_present
  - id: WF-PAIR-FREEZE-L1-L6
    source: HELIX-workflows/HELIX-process-L0-L14.md
    l1_l6_role: Requires design plus paired test-design before left-arm freeze.
    automation_connection:
      - trace_symmetry_pre_execution
      - pair_balance_map
      - vg_overview_pre_push
    current_scope_status: audit_evidence_present
  - id: WF-REQUIREMENT-DRIFT
    source: HELIX-workflows/helix-process/automation-gate-map.md
    l1_l6_role: Tracks vertical meaning drift from L1/L3 through L4-L6.
    automation_connection:
      - helix_doctor_check_requirement_drift
      - l1_l6_fr31_trace_map
    current_scope_status: detector_evidence_present
  - id: WF-VG-OVERVIEW
    source: HELIX-workflows/helix-process/automation-gate-map.md
    l1_l6_role: Aggregates registry, trace, pair, waiver, and deferred evidence.
    automation_connection:
      - helix_doctor_check_vg_overview
      - strict_full_flow_deferred_gate_summary
    current_scope_status: l6_focus_available_full_flow_deferred
  - id: WF-DB-FEEDBACK
    source: HELIX-workflows/helix-process/db-integration.md
    l1_l6_role: Defines DB convergence from signal to plan and feedback evidence.
    automation_connection:
      - db_feedback_lifecycle_coverage
      - feedback_loop_snapshot_candidate
    current_scope_status: design_covered_implementation_deferred
  - id: WF-HARNESS-TOOL-ADMISSION
    source: helix/CODEX_RUNTIME_ADAPTER.md
    l1_l6_role: Bounds Codex/HARNESS execution, web-evidence guard, and tool admission.
    automation_connection:
      - codex_guard_parity_map
      - harness_external_tools_coverage
      - web_evidence_source_map
    current_scope_status: design_and_candidate_evidence_present
automation_surfaces:
