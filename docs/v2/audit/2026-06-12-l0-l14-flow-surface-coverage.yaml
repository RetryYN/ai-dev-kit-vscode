legacy_term_policy:
  current_surfaces_must_not_contain:
    - L4 Sprint
    - L4 マイクロスプリント
    - G1..G11
    - G0.5-G11
    - G0.5〜G11
    - 6 ゲート機械検証
    - PLAN-001 の L4 実装
    - L12 デプロイ受入
    - L12 | デプロイ
    - デプロイ・受入
    - "| L14 | 運用検証 |"
    - L14 運用検証
    - 13 工程主線
    - 13工程主線
    - G4 実装凍結
    - G6 RC
    - G7 安定性
    - L5 Visual Refinement
    - L6 統合検証
    - L7 デプロイ
    - L8 受入
    - L9 デプロイ検証
    - L10 観測
    - L11 運用学習
  exception_policy: >
    Historical archives and explicitly marked legacy reference material may
    preserve old terms, but current command surfaces, workflow definitions,
    gate templates, registries, and L1-L6 audit sources must use the current
    L0-L14 vocabulary.
completion_denial:
  reason: >
    This audit proves that the current L0-L14 flow vocabulary and pair mapping
    are pinned for the L1-L6 ratification bundle. It does not prove L7
    implementation, unit-test execution, coverage closure, right-arm execution
    gates, HELIX DB write adoption, external tool execution, or full objective
    completion.
