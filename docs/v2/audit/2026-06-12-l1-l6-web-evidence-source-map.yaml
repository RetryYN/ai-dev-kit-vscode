        - it reports rule violations and can generate dependency graphs in dot, json, csv, html, mermaid, and text-like formats
        - built-in rule examples include circular dependencies, missing package.json declarations, orphan modules, and production code using dev or optional dependencies
      l1_l6_design_effect:
        - keep JS/TS source scope, rule scope, graph output normalization, circular/orphan/package-manifest policy, license review, and HELIX DB dependency edge mapping as admission gates
    - source_id: SHELLCHECK-SHELL-STATIC
