web_recheck_observations:
  fetched_on: 2026-06-12
  current_scope_action: design_evidence_only
  observations_are_adoption_evidence: false
  sources:
    - source_id: MCP-SPEC-2025-06-18
      observed:
        - base protocol and lifecycle are mandatory implementation concerns
        - HTTP authorization and stdio credential handling must be separated
        - tool/resource/prompt exposure requires host-side admission controls
      l1_l6_design_effect:
        - keep host support, auth method, tool consent, and tool-poisoning review as pre-execution gates
    - source_id: GITHUB-MCP-SERVER
      observed:
        - remote setup uses OAuth by default and PAT is an alternative
        - approved scopes and organization policy can restrict access
        - remote/local configuration implies credential and write-capability boundaries
        - toolsets, individual tools, and read-only precedence define allowlist controls
      l1_l6_design_effect:
        - require explicit approval for OAuth/PAT, org policy, data scope, and write capability before enablement
    - source_id: OPENAI-APPS-SDK-MCP-DESCRIPTOR
      observed:
        - Apps SDK tool descriptors align with MCP descriptor fields
        - outputSchema is required for structuredContent validation
        - _meta UI resource URI, model/app visibility, invocation status text, and file parameters are descriptor controls
      l1_l6_design_effect:
        - require explicit schema, visibility, file parameter, and invocation metadata policy before HARNESS plugin/App adoption
    - source_id: SEMGREP-CE
      observed:
        - semgrep scan is the candidate command surface
        - JSON and SARIF outputs are available for finding normalization
        - rule/source/license review and failure behavior remain admission decisions
      l1_l6_design_effect:
        - keep output normalization, license review, CI/local surface, and failure mode as admission gates
    - source_id: GITHUB-CODEQL
      observed:
        - default setup, advanced setup, and external CI are distinct execution routes
        - CodeQL database, query results, alerts, and SARIF ingestion require separate mapping
        - security/CI route approval is required before HELIX DB feedback ingestion
      l1_l6_design_effect:
        - keep output surface, CI route, SARIF/alert ingestion, and failure mode as admission gates
    - source_id: OPENSSF-SCORECARD
      observed:
        - Scorecard can run through GitHub Action, REST API, badge, or CLI routes
        - CLI/API use introduces PAT or GitHub App authentication and rate-limit boundaries
        - aggregate and per-check results can become advisory security posture and dependency-risk signals
      l1_l6_design_effect:
        - keep credential scope, repository scope, output normalization, license review, and CI/CLI surface as admission gates
    - source_id: DEPSDEV-API
      observed:
        - deps.dev provides package, version, requirements, dependencies, project, advisory, and query APIs
        - data can be accessed as JSON over HTTP or gRPC, with a BigQuery dataset for larger analysis
        - supported ecosystems include Cargo, Go, Maven, npm, NuGet, PyPI, and RubyGems
      l1_l6_design_effect:
        - keep ecosystem scope, dependency graph output normalization, license/advisory ingestion, API route, and HELIX DB mapping as admission gates
    - source_id: OSV-SCANNER
      observed:
        - OSV-Scanner connects dependency lists to OSV vulnerabilities through package extraction and vulnerability matching
        - source, image, lockfile/manifest, SBOM, license, pre-commit, and GitHub Action routes exist
        - output formats include JSON, SARIF, SPDX, and CycloneDX, which can be normalized into advisory findings
      l1_l6_design_effect:
        - keep dependency artifact scope, vulnerability database route, license policy, output normalization, CI/pre-commit surface, and guided remediation risk as admission gates
    - source_id: SYFT-SBOM
      observed:
        - Syft generates SBOMs from container images, filesystems, directories, files, archives, and registries
        - output formats include Syft JSON, CycloneDX, SPDX, and GitHub dependency snapshot JSON
        - registry or private source access and SBOM attestation must be separated from design-only evidence
      l1_l6_design_effect:
        - keep SBOM source scope, package cataloger scope, registry access policy, output normalization, license review, attestation policy, and HELIX DB mapping as admission gates
    - source_id: GRIMP-PYTHON-IMPORT-GRAPH
      observed:
        - Grimp builds a queryable graph of imports within Python packages
        - graph queries include children, descendants, directly imported modules, upstream modules, shortest chain, and import details
        - external package inclusion is optional and must be explicit before dependency graph ingestion
      l1_l6_design_effect:
        - keep Python package scope, external inclusion policy, import edge normalization, license review, and HELIX DB dependency edge mapping as admission gates
    - source_id: DEPENDENCY-CRUISER
      observed:
