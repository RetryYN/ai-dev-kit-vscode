schema_version: l1_l6_web_evidence_source_map_v1
owner: TL
status: verified_l1_l6_design_evidence_not_adoption
updated: 2026-06-12
scope: L1-L6
purpose: >
  Record official Web evidence used by the current L1-L6 audit and HARNESS
  external tool design without relying on L7 test-design manifests as the
  current-scope evidence source. This map proves research-backed design inputs
  only; it does not prove installation, adoption, execution, CI connection, or
  recurrence closure.
source_objective_l1_l6_coverage_audit: docs/v2/audit/2026-06-12-objective-l1-l6-coverage.yaml
source_harness_external_tools_scope_audit: docs/v2/audit/2026-06-10-harness-external-tools-impact-scope-audit.md
sources:
  - source_id: MCP-SPEC-2025-06-18
    source_type: official
    official_url: https://modelcontextprotocol.io/specification/2025-06-18/basic/index
    verified_on: 2026-06-12
    rechecked_on: 2026-06-13
    web_fetch_confirmed: true
    adoption_decision: not_adopted_current_scope
    confirmed:
      protocol: MCP
      base: JSON-RPC 2.0
      components:
        - lifecycle management
        - authorization
        - resources
        - prompts
        - tools
      design_controls:
        - host_support
        - tool_invocation_consent_required
        - tool_poisoning_review_required
        - auth_method
        - input_schema_required
        - output_schema_validation
        - structured_content_validation
        - tool_result_error_semantics
        - audit_log_required
        - timeout_policy_required
      l1_l6_mapping: >
        HARNESS MCP admission must keep protocol, lifecycle, authorization,
        tool-scope, consent, and tool-poisoning review as pre-execution design
        controls.
      2026_06_13_official_recheck:
        official_url: https://modelcontextprotocol.io/specification/2025-06-18/server/tools
        confirmed:
          - MCP tools expose JSON Schema inputSchema and optional outputSchema.
          - StructuredContent output should be schema validated by clients.
          - Sensitive tool calls require user-visible confirmation controls.
          - Clients should show tool inputs, validate results, implement timeouts, and log tool usage.
    current_scope_action: L4-L6 design evidence only
