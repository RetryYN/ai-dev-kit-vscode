      path: docs/plans/add-feature/add-feature-2026-06-15-c2-ruff-shellcheck-advisory.md
      observed_status: in_progress
      classification: current_scope_authorized_c2_ruff_shellcheck_advisory
      reason: >
        User-approved current-scope §4.1 automation step (C-2 ruff/shellcheck
        advisory CI job). External-tool install/execute is authorized ONLY as an
        advisory-only CI job (continue-on-error, not a Required check, not wired
        to detector-gate / doctor --gate / push gate fail-close). It does not
        authorize required/fail-close external-tool gating, L7 product
        implementation, DB schema work, or W1 broad flip.
