      path: docs/plans/add-feature/add-feature-2026-06-16-c3a-fr-uses-forward-full-required.md
      observed_status: in_progress
      classification: current_scope_authorized_c3a_fr_uses_forward_full_required
      reason: >
        User-approved current-scope §4.1 automation step (C-3a): fr_uses
        forward target-existence (uses-target must exist) full-scan required
        only. This is a narrow per-detector flip, explicitly NOT the forbidden
        broad advisory→fail-close flip of W1 detectors. Reverse (逆参照)
        required promotion is excluded as a separate later action
        (DF-P2-FRUSES-PROMOTE). It does not authorize other detectors'
        full-required promotion, L7 product implementation, DB schema work, or
        external-tool required gating.
