external_standard_evidence:
  - source_id: ISO-12207-2026
    source_name: ISO/IEC/IEEE 12207:2026
    official_url: https://www.iso.org/standard/90219.html
    confirmed_version: Edition 2
    confirmed_status: Published; publication date 2026-04; stage 60.60
    control_relevance: full_lifecycle_and_process_improvement
    helix_mapping: L0-L14 full lifecycle, including operation, support, retirement, and improvement.
  - source_id: ISO-29148-2018
    source_name: ISO/IEC/IEEE 29148:2018
    official_url: https://www.iso.org/standard/72089.html
    confirmed_version: Edition 2
    confirmed_status: Published 2018-11; stage 90.92 to be revised as of 2026-02-16.
    control_relevance: requirements_engineering_information_items
    helix_mapping: L1-L6 requirements-to-design trace, required information items, and requirement_drift closure.
  - source_id: IEEE-P1012
    source_name: IEEE 1012 / P1012 V&V
    official_url: https://standards.ieee.org/ieee/1012/12536/
    confirmed_version: Active PAR
    confirmed_status: Standard for System, Software, and Hardware Verification and Validation.
    control_relevance: paired_verification_and_validation
    helix_mapping: L6-L7 through L1-L14 pair gates must close with execution evidence, not design-only evidence.
  - source_id: NIST-SP-800-218
    source_name: NIST SP 800-218 SSDF v1.1
    official_url: https://csrc.nist.gov/pubs/sp/800/218/final
    confirmed_version: Version 1.1
    confirmed_status: Final; date published 2022-02.
    control_relevance: secure_software_development_practices
    helix_mapping: Security requirements and unit/integration/acceptance/operational gates must keep vulnerability prevention and recurrence feedback in scope.
