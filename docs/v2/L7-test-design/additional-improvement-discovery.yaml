schema_version: additional_improvement_discovery_v1
owner: TL
status: discovered_not_adopted
updated: 2026-06-10
source_goal_audit: docs/v2/L7-test-design/goal-completion-audit.yaml
source_web_evidence_map: docs/v2/L7-test-design/web-evidence-source-map.yaml
purpose: >
  Capture feasible improvements not explicitly present in the original HELIX
  definition, with official Web evidence and a clear boundary between discovery,
  PLAN adoption, implementation, and closure evidence.
web_evidence:
  - source_id: OWASP-SAMM
    source_type: official
    official_url: https://owaspsamm.org/model/
    fetched: true
    verified_on: 2026-06-10
    confirmed_focus:
      - Governance
      - Design
      - Implementation
      - Verification
      - Operations
    helix_relevance: Secure SDLC maturity can be mapped across L1-L14 instead of being limited to a single security checklist.
  - source_id: SLSA-1.2
    source_type: official
    official_url: https://slsa.dev/spec/v1.2/
    fetched: true
    verified_on: 2026-06-10
    confirmed_status: Approved
    confirmed_focus:
      - supply chain security levels
      - provenance
      - build track
      - source track
      - verification summary attestation
    helix_relevance: Build/source provenance and verification summaries can strengthen CI or equivalent full-flow gate evidence.
  - source_id: OPENTELEMETRY-SIGNALS
    source_type: official
    official_url: https://opentelemetry.io/docs/concepts/signals/
    fetched: true
    verified_on: 2026-06-10
    confirmed_last_modified: 2026-03-10
    confirmed_focus:
      - Traces
      - Metrics
      - Logs
      - Baggage
      - Events
      - Profiles
    helix_relevance: HELIX DB feedback-loop events can use signal categories consistently for troubleshooting and recurrence detection.
  - source_id: OPENSSF-SCORECARD
    source_type: official
    official_url: https://openssf.org/scorecard/
    fetched: true
    verified_on: 2026-06-10
    confirmed_focus:
      - auto-generating security score
      - trust risk and security posture
      - OSS security initiative
    helix_relevance: Repository security health can be added as an advisory automation surface without redefining L6 focus.
  - source_id: MCP-SPEC-2025-06-18
    source_type: official
    official_url: https://modelcontextprotocol.io/specification/2025-06-18/basic/index
    fetched: true
    verified_on: 2026-06-10
    confirmed_focus:
      - JSON-RPC 2.0 base protocol
      - lifecycle management
      - authorization
      - resources prompts and tools
    helix_relevance: HARNESS can admit MCP servers only after protocol, lifecycle, auth, and tool-scope checks are registered.
  - source_id: GITHUB-MCP-SERVER
    source_type: official
    official_url: https://docs.github.com/en/copilot/how-tos/provide-context/use-mcp-in-your-ide/set-up-the-github-mcp-server
    fetched: true
    verified_on: 2026-06-10
    confirmed_focus:
      - GitHub-maintained MCP server
      - remote or local configuration
      - GitHub account and policy prerequisites
      - OAuth or PAT scope boundary
    helix_relevance: GitHub repo, issue, PR, workflow, and code context can be exposed to HARNESS through an approved MCP integration.
  - source_id: SEMGREP-CE
    source_type: official
    official_url: https://docs.semgrep.dev/deployment/oss-deployment
    fetched: true
    verified_on: 2026-06-10
    confirmed_focus:
      - Community Edition CI
      - open source components
      - semgrep scan
      - rule license verification
    helix_relevance: SAST findings can feed trouble detection and coding-rule/TDD hardening without relying on manual review.
  - source_id: GITHUB-CODEQL
    source_type: official
    official_url: https://docs.github.com/en/code-security/concepts/code-scanning/codeql/codeql-code-scanning
    fetched: true
    verified_on: 2026-06-10
    confirmed_focus:
      - code scanning
      - CodeQL database
      - vulnerabilities and errors
      - GitHub Actions or external CI
    helix_relevance: Code scanning evidence can feed impact analysis, dependency visibility, and security regression feedback.
discovery_boundary:
  candidates_discovered: true
  plan_or_pr_adopted: false
  implementation_done: false
  gate_evidence_closed: false
  goal_complete_allowed: false
  reason: Discovery creates candidate backlog only; each candidate needs separate PLAN, owner, allowed_files, acceptance, rollback, and verification evidence.
candidates:
  - id: IMP-SEC-MATURITY-SAMM-MAP
    title: Map HELIX L0-L14 artifacts to OWASP SAMM business functions.
    source_ids:
      - OWASP-SAMM
    benefit: Makes security maturity review explicit across governance, design, implementation, verification, and operations.
    proposed_layers:
      - L1
      - L4
      - L5
      - L6
      - L13
      - L14
    current_scope_action: record candidate only
    adoption_required:
      - PLAN with target maturity level and artifact mapping.
      - Gate check that does not treat SAMM mapping as a replacement for OWASP Top 10 review.
      - Feedback-loop category for maturity drift findings.
    safety:
      schema_migration: false
      infrastructure_change: false
      auth_or_pii_change: false
    status: candidate
  - id: IMP-SUPPLY-CHAIN-SLSA-PROVENANCE
    title: Add SLSA provenance and verification summary as CI or equivalent evidence.
    source_ids:
      - SLSA-1.2
    benefit: Gives full-flow gates stronger proof that tested artifacts came from expected source and build process.
    proposed_layers:
      - L7
      - L12
      - L13
    current_scope_action: record candidate only
    adoption_required:
      - Handover expansion for CI or release pipeline files.
      - Provenance generation and verification policy.
      - Failure behavior recorded in gate output and HELIX DB events.
    safety:
      schema_migration: false
      infrastructure_change: true
      auth_or_pii_change: false
    status: candidate_requires_confirmation
  - id: IMP-OBSERVABILITY-SIGNAL-TAXONOMY
    title: Normalize HELIX DB feedback records by OpenTelemetry signal categories.
    source_ids:
      - OPENTELEMETRY-SIGNALS
    benefit: Aligns trouble detection, metrics, logs, events, and recurrence feedback with a vendor-neutral observability vocabulary.
    proposed_layers:
      - L13
      - L14
    current_scope_action: record candidate only
    adoption_required:
      - PLAN for event category taxonomy update without DB migration.
      - Tests proving existing events remain readable.
      - Feedback-loop output includes signal classification and recurrence linkage.
    safety:
      schema_migration: false
      infrastructure_change: false
      auth_or_pii_change: false
    status: candidate
  - id: IMP-REPO-SECURITY-SCORECARD
    title: Add OpenSSF Scorecard as an advisory repository security-health input.
    source_ids:
      - OPENSSF-SCORECARD
    benefit: Adds automated repository hygiene evidence for risk posture without blocking L6 focus by default.
    proposed_layers:
      - L7
      - L13
    current_scope_action: record candidate only
    adoption_required:
      - Decide local, CI, or scheduled execution surface.
      - Record advisory threshold and waiver policy.
      - Keep external calls and token usage opt-in.
    safety:
      schema_migration: false
      infrastructure_change: true
      auth_or_pii_change: false
    status: candidate_requires_confirmation
  - id: IMP-HARNESS-MCP-ADMISSION-GATE
    title: Add HARNESS MCP server admission registry and approval gate.
    source_ids:
      - MCP-SPEC-2025-06-18
      - GITHUB-MCP-SERVER
    benefit: Prevents unreviewed MCP servers or tools from entering the harness without protocol, auth, credential, and scope evidence.
    proposed_layers:
      - L6
      - L7
      - L13
    current_scope_action: feature ticket only
    feature_plan: docs/plans/add-feature/add-feature-2026-06-10-harness-external-tools-ddd-tdd-impact.md
    adoption_required:
      - Registry entry with official source, transport, auth, token scope, write capability, and owner.
      - HARNESS allowlist gate that blocks unapproved MCP server execution.
      - HELIX DB event for every admitted or rejected server/tool.
    safety:
      schema_migration: false
      infrastructure_change: true
      auth_or_pii_change: true
    status: candidate_requires_confirmation
  - id: IMP-HARNESS-SEMGREP-CE-SAST
    title: Add Semgrep CE as an advisory HARNESS SAST input.
    source_ids:
      - SEMGREP-CE
    benefit: Adds coding-rule and TDD hardening evidence from static findings while keeping rule licensing explicit.
    proposed_layers:
      - L6
      - L7
      - L13
    current_scope_action: feature ticket only
    feature_plan: docs/plans/add-feature/add-feature-2026-06-10-harness-external-tools-ddd-tdd-impact.md
    adoption_required:
      - Decide local-only, CI, or scheduled HARNESS execution surface.
      - Verify rule licenses and fail behavior.
      - Register findings as HELIX DB events/metrics/feedback without auto-fix.
    safety:
      schema_migration: false
      infrastructure_change: true
      auth_or_pii_change: false
    status: candidate_requires_confirmation
  - id: IMP-HARNESS-CODEQL-IMPACT
    title: Add CodeQL/code-scanning evidence to HARNESS impact and security feedback.
    source_ids:
      - GITHUB-CODEQL
    benefit: Connects code scanning alerts and CodeQL database/query results to security regression and impact analysis.
    proposed_layers:
      - L6
      - L7
      - L13
    current_scope_action: feature ticket only
    feature_plan: docs/plans/add-feature/add-feature-2026-06-10-harness-external-tools-ddd-tdd-impact.md
    adoption_required:
      - Confirm GitHub security feature availability and CI/external-CI route.
      - Define SARIF or JSON ingestion contract.
      - Map alerts to affected artifacts, required gates, and HELIX DB feedback entries.
    safety:
      schema_migration: false
      infrastructure_change: true
      auth_or_pii_change: false
    status: candidate_requires_confirmation
completion_requirements_before_any_candidate_counts_as_done:
  - Candidate is promoted to a PLAN with owner, scope, allowed_files, acceptance, rollback, and verification commands.
  - Implementation is completed under an approved handover scope.
  - Gate, CI or equivalent, and HELIX DB feedback evidence prove the intended behavior.
  - Goal audit is updated only after evidence exists; discovery alone remains partial.
non_goals_under_current_handover:
  - CI workflow modification
  - release provenance generation
  - OpenSSF Scorecard execution against a remote repository
  - MCP server installation or authentication setup
  - Semgrep or CodeQL installation
  - DB schema migration
  - automatic PLAN or PR creation
verification_contracts:
  - surface: l0_l14_contract
    command: python3 -m pytest cli/lib/tests/test_helix_l0_l14_flow_contract.py -q
    proves:
      - official Web-backed improvement candidates are machine-readable
      - discovery remains separate from adopted closure evidence
      - infrastructure-affecting candidates require confirmation
