schema_version: right_arm_execution_gate_handover_request_v1
owner: TL
status: needs_handover_expansion
updated: 2026-06-09
source_adoption_manifest: docs/v2/L7-test-design/right-arm-execution-gates-adoption.yaml
source_goal_audit: docs/v2/L7-test-design/goal-completion-audit.yaml
source_closure_plan: docs/v2/L7-test-design/right-arm-full-flow-closure-plan.yaml
current_scope:
  sufficient_for_gate_implementation: false
  allowed_now:
    - docs/v2/L7-test-design/
    - cli/lib/tests/
    - cli/tests/
    - docs/plans/process/process-2026-06-03-v2-implementation-roadmap.md
  rule: Do not edit implementation files outside current handover Next Action.
activation_policy:
  requires_explicit_handover_update: true
  self_expand_current_handover: false
  allowed_after_activation_only: true
  activation_evidence_required:
    - handover Next Action includes requested implementation files.
    - task-plan or PLAN frontmatter includes allowed_files and acceptance evidence.
    - strict full-flow command is the exit gate.
requested_next_action:
  summary: Expand handover scope to implement and pass G8/G9/G12/G14 right-arm execution gates.
  completion_exit_gate: HELIX_DOCTOR_SKIP_EXEC_TESTS=1 helix doctor check_vg_overview --strict-full-flow --json
  required_overall_clean: true
  gates:
    - gate_id: G8
      pair: L5-L8
      plan_id: PLAN-G8-INTEGRATION-EXECUTION-GATE
      requested_files:
        - cli/lib/vg_overview.py
        - cli/helix-doctor
        - cli/lib/tests/test_vg_overview.py
        - cli/tests/helix-doctor-json.bats
        - docs/v2/L8-test-design/
      acceptance:
        - G8 removed from strict full-flow deferred_pairs.
        - L5-L8 integration test execution evidence is present.
        - L5-L8 trace closure remains coverage=100 with orphan=0.
      acceptance_exit_condition: G8 removed from strict full-flow deferred_pairs
      verification_commands:
        - python3 -m pytest cli/lib/tests/test_vg_overview.py -q
        - bats cli/tests/helix-doctor-json.bats
        - HELIX_DOCTOR_SKIP_EXEC_TESTS=1 helix doctor check_vg_overview --strict-full-flow --json
    - gate_id: G9
      pair: L4-L9
      plan_id: PLAN-G9-SYSTEM-EXECUTION-GATE
      requested_files:
