adoption_boundary:
  candidate_generated: true
  db_snapshot_registered: true
  plan_or_pr_adopted: false
  gate_evidence_closed: false
  feedback_closed: false
  goal_complete_allowed: false
  reason: plan_candidates and pr_candidates are adoption proposals, not accepted closure evidence.
completion_requirements:
  - adoption chain follows docs/v2/L7-test-design/feedback-adoption-closure-readiness.yaml.
  - candidate is promoted to PLAN with owner, allowed_files, acceptance, rollback, and evidence.
  - PR or local change implements the approved PLAN without auto-apply.
  - gate evidence proves the corresponding deferred pair disappeared.
  - HELIX DB events/metrics/feedback record adoption result and recurrence-detection closure.
  - strict full-flow command reports overall_clean=true.
non_goals_under_current_handover:
  - gate or detector body edits
  - DB schema migration
  - automatic application of plan_candidates or pr_candidates
  - destructive DB/data operation
verification_contracts:
  - surface: pytest
    command: python3 -m pytest cli/lib/tests/test_harness_monitor_unit.py -q
    proves:
      - snapshot schema and candidate categories
      - missing feedback auto-registration behavior
      - event/metric payload shape
  - surface: bats
    command: bats cli/tests/test-helix-harness-feedback-loop.bats
    proves:
      - top-level command routing
      - isolated DB events/metrics/feedback append
      - strict VG deferred pairs match right-arm adoption manifest
      - safety flags remain false
  - surface: l0_l14_contract
    command: python3 -m pytest cli/lib/tests/test_helix_l0_l14_flow_contract.py -q
    proves:
      - feedback-loop adoption audit remains partial until accepted evidence exists
