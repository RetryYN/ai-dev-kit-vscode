name: commitlint

on:
  pull_request:
    branches:
      - main

# PLAN-222 / ADR-036: 最小権限原則
permissions:
  contents: read

jobs:
  lint:
    name: ci/commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate commit messages
        run: npx --yes commitlint --from origin/main --to HEAD
