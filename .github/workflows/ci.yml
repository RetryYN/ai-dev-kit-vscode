name: CI

on:
  push:
    branches:
      - main
      - dogfood
      - feature/**
  pull_request:
    branches:
      - main

# Forward 逸脱→Issue / GitHub Flow 運用最適 (HELIX-workflows/helix-process/github-operations.md §3)
# 同一 ref の旧 run を自動キャンセルし CI 多重起動を抑止する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PLAN-222 / ADR-036: 最小権限原則 (zizmor excessive-permissions / undocumented-permissions 対応)
permissions:
  contents: read

env:
  HELIX_HOME: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "GitHub Actions CI"

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run helix-test
        run: bash cli/helix-test

      - name: Run bats
        run: bats cli/tests/*.bats

      - name: Run helix-verify-all
        run: bash cli/helix-verify-all

      - name: Install dev requirements
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        run: python3 -m pip install --quiet -r requirements-dev.txt

      - name: Run pytest
        if: ${{ hashFiles('cli/lib/tests/**') != '' }}
        run: python3 -m pytest cli/lib/tests/ -v

      # GAP-034: drift-check を PR で変更された D-API/D-CONTRACT/D-DB ファイルに対して実行
      - name: Detect changed design files
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          # base と head の差分から D-API/D-CONTRACT/D-DB ファイルを検出
          git fetch origin ${{ github.base_ref }} --depth=1 || true
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -E '^(D-API|D-CONTRACT|D-DB|docs/D-API|docs/D-CONTRACT|docs/D-DB)/' || true)
          if [[ -n "$changed_files" ]]; then
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$changed_files" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Run drift-check on changed design files
        if: github.event_name == 'pull_request' && steps.changed.outputs.has_changes == 'true'
        run: |
          echo "=== Drift Check ==="
          echo "${{ steps.changed.outputs.files }}" | while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo ""
            echo "--- $file ---"
            bash cli/helix-drift-check "$file" || true
          done

  detector-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR の merge-base 到達性を確保し、ratchet detector の changed-files が
          # available_empty に degrade して vacuous clean になるのを防ぐ (F4)
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # helix-doctor は system python3 ではなく実行系の python3 を使うため、
      # vg_overview が import する PyYAML を clean な setup-python 環境へ明示 install する
      - name: Install dev requirements
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        run: python3 -m pip install --quiet -r requirements-dev.txt

      - name: Export PR changed files for ratchet detectors
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 || true
          changed_files="$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || true)"
          {
            echo "HELIX_CHANGED_FILES<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # DF-FCCI-CI-RATCHET-PUSH: push event でも changed-files を注入する。これを欠くと
      # HELIX_CHANGED_FILES が未設定 → changed_files() が detached HEAD で source_status=
      # unavailable → ratchet が clean override = vacuous clean (fail-OPEN) になる。
      # fetch-depth: 0 で event.before が到達可能なので event.before..sha の diff range を
      # HELIX_CHANGED_FILES へ注入する。新ブランチ/force-push 等で before が全0/未到達なら
      # `|| true` で空文字 export → source_status=available_empty (changed-file 0 件として
      # clean。git diff 失敗を「変更なし」扱いにする稀な edge = P2 残リスク。force-push は
      # branch protection が抑止、PR path + `helix push --gate` が依然 authoritative)。
      - name: Export push changed files for ratchet detectors
        if: github.event_name == 'push'
        run: |
          changed_files="$(git diff --name-only ${{ github.event.before }}..${{ github.sha }} 2>/dev/null || true)"
          {
            echo "HELIX_CHANGED_FILES<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # VG-overview pre-push gate のみを isolated に fail-close 評価する。
      # `helix doctor --gate` (全体) は .helix/ project-state に依存し fresh checkout で
      # 常時 red になるため使わない。check_vg_overview --gate は overall_clean のみに依存する。
      - name: Run detector gate (VG-overview)
        run: |
          export PATH="$PWD/cli:$PATH"
          HELIX_DOCTOR_SKIP_EXEC_TESTS=1 helix doctor check_vg_overview --gate --json

  # Process §4.1 ② / C-2 (add-feature-2026-06-15-c2-ruff-shellcheck-advisory):
  # ruff/shellcheck を CI で install/execute する advisory-only job。ユーザー明示承認で
  # forbidden_now「install/execute external tools」を advisory-only に限定解禁したもの。
  # continue-on-error: true で PR/CI を落とさない (Required 非対象、needs なし、detector-gate /
  # doctor --gate / push gate へ fail-close 接続しない、--gate を付けない)。required 化は
  # 依然 forbidden_now (別 Action / 明示承認)。ruff は requirements-dev.txt に入れず本 job 内
  # でのみ install する (test/detector-gate へ波及して advisory 境界が崩れるのを防ぐ)。
  ruff-shellcheck-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyYAML 等 (coding_rule_lint が registry を import yaml する) のため requirements-dev を
      # install する。ruff は含めない (requirements-dev には足さない)。
      - name: Install dev requirements (PyYAML etc., not ruff)
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        run: python3 -m pip install --quiet -r requirements-dev.txt

      - name: Install ruff (advisory job only, not in requirements-dev.txt)
        run: python3 -m pip install --quiet ruff

      - name: Install shellcheck (advisory job only)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run coding-rule lint (advisory, no --gate, continue-on-error)
        run: |
          export PATH="$PWD/cli:$PATH"
          helix doctor check_coding_rule_lint --json
