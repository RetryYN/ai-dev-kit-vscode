name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Forward 逸脱→Issue / GitHub Flow 運用最適 (HELIX-workflows/helix-process/github-operations.md §3)
# 同一 ref の旧 run を自動キャンセルし CI 多重起動を抑止する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PLAN-222 / ADR-036: 最小権限原則 (zizmor excessive-permissions / undocumented-permissions 対応)
permissions:
  contents: read

env:
  HELIX_HOME: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "GitHub Actions CI"

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run helix-test
        run: bash cli/helix-test

      - name: Run bats
        run: bats cli/tests/*.bats

      - name: Run helix-verify-all
        run: bash cli/helix-verify-all

      - name: Install dev requirements
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        run: python3 -m pip install --quiet -r requirements-dev.txt

      - name: Run pytest
        if: ${{ hashFiles('cli/lib/tests/**') != '' }}
        run: python3 -m pytest cli/lib/tests/ -v

      # GAP-034: drift-check を PR で変更された D-API/D-CONTRACT/D-DB ファイルに対して実行
      - name: Detect changed design files
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          # base と head の差分から D-API/D-CONTRACT/D-DB ファイルを検出
          git fetch origin ${{ github.base_ref }} --depth=1 || true
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -E '^(D-API|D-CONTRACT|D-DB|docs/D-API|docs/D-CONTRACT|docs/D-DB)/' || true)
          if [[ -n "$changed_files" ]]; then
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$changed_files" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Run drift-check on changed design files
        if: github.event_name == 'pull_request' && steps.changed.outputs.has_changes == 'true'
        run: |
          echo "=== Drift Check ==="
          echo "${{ steps.changed.outputs.files }}" | while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo ""
            echo "--- $file ---"
            bash cli/helix-drift-check "$file" || true
          done

  detector-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR の merge-base 到達性を確保し、ratchet detector の changed-files が
          # available_empty に degrade して vacuous clean になるのを防ぐ (F4)
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # helix-doctor は system python3 ではなく実行系の python3 を使うため、
      # vg_overview が import する PyYAML を clean な setup-python 環境へ明示 install する
      - name: Install dev requirements
        if: ${{ hashFiles('requirements-dev.txt') != '' }}
        run: python3 -m pip install --quiet -r requirements-dev.txt

      - name: Export PR changed files for ratchet detectors
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 || true
          changed_files="$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || true)"
          {
            echo "HELIX_CHANGED_FILES<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # VG-overview pre-push gate のみを isolated に fail-close 評価する。
      # `helix doctor --gate` (全体) は .helix/ project-state に依存し fresh checkout で
      # 常時 red になるため使わない。check_vg_overview --gate は overall_clean のみに依存する。
      - name: Run detector gate (VG-overview)
        run: |
          export PATH="$PWD/cli:$PATH"
          HELIX_DOCTOR_SKIP_EXEC_TESTS=1 helix doctor check_vg_overview --gate --json
