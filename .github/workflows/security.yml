name: Security (zizmor GitHub Actions audit)

# PLAN-222 / ADR-036: GitHub Actions workflow security audit (zizmor)
# - PR ごとに走り SARIF 出力 + GitHub Security tab upload
# - 既存 6 workflow と独立、security 専用 workflow

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  zizmor-scan:
    name: zizmor / GitHub Actions security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # SARIF upload 用
    steps:
      - name: Checkout
        # PLAN-222 AC-1 / ADR-036: SHA pin + version comment (Dependabot upgrade 互換)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install zizmor
        run: python3 -m pip install zizmor

      - name: Run zizmor (SARIF output)
        run: zizmor --format sarif .github/workflows/ > zizmor-results.sarif || true

      - name: Run zizmor (text output for log)
        # exit code 非 0 で fail させ、SARIF は前 step で生成済
        run: zizmor .github/workflows/

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('zizmor-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8  # v3.28.0
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor
