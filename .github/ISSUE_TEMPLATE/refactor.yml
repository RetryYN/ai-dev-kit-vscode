name: "🧹 Refactor — 振る舞い不変の構造改善"
description: "振る舞いを保ったまま構造劣化を収束し、成果を Forward の該当工程へ戻す (駆動 workflow: Refactor)"
title: "[refactor] "
labels: ["refactor", "deviation"]
body:
  - type: markdown
    attributes:
      value: |
        **Refactor workflow** — 振る舞いを変えずに構造劣化を改善する作業を可視化する Issue です。
        **振る舞い不変を保護**（既存テストが緑のまま）し、構造改善を `forward_return`（主に L7）へ戻して close します。
        正本: `HELIX-workflows/helix-process/refactor-workflow.md` / `HELIX-workflows/helix-process/plan-model.md`
  - type: textarea
    id: symptom
    attributes:
      label: 症状 / 構造劣化 (Symptom)
      description: 改善対象の構造劣化（重複・複雑度・命名・分割）。対象パスを記載。
      placeholder: "例) cli/helix-* に重複した PLAN locate ロジックが散在。"
    validations:
      required: true
  - type: textarea
    id: deviation-origin
    attributes:
      label: 逸脱起点 / 振る舞い不変の保証 (Behavior-preservation)
      description: 劣化が混入した経緯と、振る舞い不変をどう保証するか（保護するテスト）。
    validations:
      required: true
  - type: dropdown
    id: forward-return-layer
    attributes:
      label: forward_return — 戻し先 Forward 層
      description: "構造改善を戻す Forward 工程 (Refactor → 主に L7、設計反映が要るなら L5/L6)。"
      options:
        - L7 実装
        - L5 詳細設計
        - L6 機能設計
    validations:
      required: true
  - type: input
    id: forward-return-detail
    attributes:
      label: forward_return (具体)
      description: 戻し先の成果物・節。
      placeholder: "例) L7 実装: 共通 locate helper へ集約"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受入条件 (Acceptance / close 条件)
      description: 振る舞い不変（既存テスト緑）+ 構造改善の達成基準。
    validations:
      required: true
  - type: input
    id: plan-id
    attributes:
      label: plan_id (対応する駆動 PLAN、未起票なら TBD)
      placeholder: "例) refactor-2026-06-03-plan-locate"
  - type: input
    id: parent-process
    attributes:
      label: parent_process (親 Process PLAN path、単独 Action なら空)
      placeholder: "例) docs/plans/process/process-2026-....md"
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - "P0"
        - "P1"
        - "P2"
    validations:
      required: true
